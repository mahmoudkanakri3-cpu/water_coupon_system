<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كوبونات المياه - بوابة الخصم</title>
    <!-- خط Tajawal لتصميم احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
   <script src="https://unpkg.com/html5-qrcode"></script>
   <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 32px 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            width: 56px;
            height: 56px;
            background: #e0f2fe;
            color: var(--primary);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
            background-color: #fafafa;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 18px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon">💧</div>
            <h2>بوابة الخصم للموزعين</h2>
            <p>قم بخصم الكوبونات وإرسال الإشعار للزبون مباشرة</p>
        </div>

        <form id="deductForm">
            <div class="form-group">
                <label for="driverPhone">رقم هاتف الموزع</label>
                <input type="tel" id="driverPhone" placeholder="07XXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="driverPassword">كلمة مرور الموزع</label>
                <input type="password" id="driverPassword" placeholder="••••••••" required>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label for="customerPhone">رقم هاتف الزبون</label>
                    <input type="tel" id="customerPhone" placeholder="07XXXXXXXX" required>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="amount">عدد الكوبونات</label>
                    <input type="number" id="amount" value="1" min="1" required>
                </div>
            </div>

            <button type="submit" id="submitBtn">تاكيد الخصم والإرسال</button>
        </form>

        <div id="alertBox" class="alert"></div>

        <div class="footer-note">
            يتم تسجيل العملية فوراً وإرسال إشعار واتساب للزبون
        </div>
    </div>

    <script>
        const form = document.getElementById('deductForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // إخفاء التنبيه السابق وتعطيل الزر مؤقتاً
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري تنفيذ الخصم...';

            const payload = {
                driverPhone: document.getElementById('driverPhone').value,
                driverPassword: document.getElementById('driverPassword').value,
                customerPhone: document.getElementById('customerPhone').value,
                amount: document.getElementById('amount').value
            };

            try {
                const response = await fetch('/api/deduct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = data.message;
                    // إعادة تعيين حقول الزبون فقط لسهولة إدخال عملية جديدة
                    document.getElementById('customerPhone').value = '';
                    document.getElementById('amount').value = '1';
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.message;
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'حدث خطأ في الاتصال بالسيرفر';
            } finally {
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'تاكيد الخصم والإرسال';
            }
        });
    </script>
</body>
</html>
