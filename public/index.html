<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كوبونات الماء</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>💧 كوبونات الماء</h1>

        <!-- قسم الاستعلام -->
        <div class="card" style="background-color: #e0f7fa;">
            <h3>استعلام عن رصيد الكوبونات</h3>
            <input type="tel" id="checkPhone" placeholder="أدخل رقم هاتف الزبون">
            <button class="btn" onclick="checkBalance()">عرض الرصيد</button>

            <div id="balanceResult" style="margin-top: 15px; display: none; text-align: center;">
                <h2 id="balanceCount" style="font-size: 2.8rem; color: #0077b6; margin: 5px 0;">0</h2>
                <p id="welcomeMsg" style="color: #555; font-weight: 500;"></p>
            </div>
        </div>

        <!-- قسم الخصم -->
        <div class="card">
            <h3>خصم كوبون (للموزع)</h3>
            
            <input type="tel" id="driverPhone" placeholder="رقم هاتف الموزع">
            <input type="password" id="driverPassword" placeholder="كلمة المرور">
            <input type="tel" id="customerPhone" placeholder="رقم هاتف الزبون">
            <input type="number" id="couponCount" value="1" min="1" placeholder="عدد الكوبونات المراد خصمها">

            <button class="btn btn-success" onclick="deductCoupons()">تسجيل خصم الكوبونات</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // تحديد رابط الـ API: يعمل تلقائياً إذا كان الملف يخدمه السيرفر، أو يستهدف عنوان IP الجهاز
const API_BASE_URL = 'http://192.168.100.10:3000';
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `show ${type}`;
            setTimeout(() => { toast.className = toast.className.replace(`show ${type}`, ''); }, 3000);
        }

        async function checkBalance() {
            const phone = document.getElementById('checkPhone').value.trim();
            const balanceResult = document.getElementById('balanceResult');
            const balanceCount = document.getElementById('balanceCount');
            const welcomeMsg = document.getElementById('welcomeMsg');

            if (!phone) {
                showToast('يرجى إدخال رقم الهاتف', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/customers/${phone}`);
                const data = await res.json();

                if (data.success) {
                    balanceResult.style.display = 'block';
                    balanceCount.innerText = data.customer.coupons_balance;
                    welcomeMsg.innerText = `مرحباً ${data.customer.name} - كوبون متبقي`;
                    showToast('تم جلب البيانات بنجاح', 'success');
                } else {
                    balanceResult.style.display = 'none';
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('تعذر الاتصال بالسيرفر', 'error');
            }
        }

        async function deductCoupons() {
            const driverPhone = document.getElementById('driverPhone').value.trim();
            const driverPassword = document.getElementById('driverPassword').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const countInput = document.getElementById('couponCount').value;
            const count = parseInt(countInput, 10) || 1;

            if (!driverPhone || !driverPassword || !customerPhone) {
                showToast('يرجى تعبئة جميع الحقول المطلوبة', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/deduct-coupon`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driverPhone, driverPassword, customerPhone, count })
                });

                const data = await res.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    document.getElementById('customerPhone').value = '';
                    document.getElementById('couponCount').value = '1';

                    if (document.getElementById('checkPhone').value.trim() === customerPhone) {
                        checkBalance();
                    }
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('تعذر الاتصال بالسيرفر', 'error');
            }
        }
    </script>
</body>
</html>
