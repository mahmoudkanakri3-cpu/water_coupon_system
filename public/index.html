<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المحطة - نظام كوبونات المياه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Top Navbar */
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-logout {
            background: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #fee2e2;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .stat-card .title {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 8px;
            color: var(--text);
        }

        .stat-card .unit {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Tabs & Content */
        .tabs {
            display: flex;
            gap: 12px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .tab-content.active {
            display: block;
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-light);
            font-weight: 700;
            font-size: 14px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-recharge { background: #dcfce7; color: var(--success); }
        .badge-deduct { background: #fee2e2; color: var(--error); }

        /* Login Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 32px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول للمحطة -->
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h2 style="text-align: center; margin-bottom: 8px;">تسجيل دخول المحطة</h2>
            <p style="text-align: center; color: var(--text-light); margin-bottom: 24px; font-size: 14px;">أدخل بيانات المحطة للوصول إلى لوحة التحكم</p>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>رقم هاتف المحطة</label>
                    <input type="tel" id="loginPhone" placeholder="07XXXXXXXX" required>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" style="width: 100%;">دخول</button>
            </form>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="mainDashboard" style="display: none;">
        <nav class="navbar">
            <div class="brand">💧 نظام كوبونات المياه</div>
            <div class="user-info">
                <span id="stationNameDisplay" style="font-weight: 700;">محطة المياه</span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </nav>

        <div class="container">
            <!-- كروت الإحصائيات -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="title">إجمالي الشحن</div>
                    <div class="value" id="statRecharged">0 <span class="unit">كوبون</span></div>
                </div>
                <div class="stat-card">
                    <div class="title">إجمالي الخصم</div>
                    <div class="value" id="statDeducted">0 <span class="unit">كوبون</span></div>
                </div>
                <div class="stat-card">
                    <div class="title">رصيد الزبائن الحقيقي</div>
                    <div class="value" id="statBalance" style="color: var(--primary);">0 <span class="unit">كوبون</span></div>
                </div>
            </div>

            <!-- التبويبات -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('rechargeTab', this)">شحن زبون</button>
                <button class="tab-btn" onclick="switchTab('driverTab', this)">إضافة موزع</button>
                <button class="tab-btn" onclick="switchTab('historyTab', this)">سجل الحركات</button>
            </div>

            <!-- محتوى تبويب الشحن -->
            <div id="rechargeTab" class="tab-content active">
                <h3 style="margin-bottom: 16px;">شحن كوبونات لزبون</h3>
                <form id="rechargeForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم الزبون</label>
                            <input type="text" id="custName" placeholder="الاسم الكامل" required>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="tel" id="custPhone" placeholder="07XXXXXXXX" required>
                        </div>
                        <div class="form-group">
                            <label>عدد الكوبونات</label>
                            <input type="number" id="custCoupons" value="10" min="1" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">تأكيد الشحن وإرسال الواتساب</button>
                </form>
            </div>

            <!-- محتوى تبويب إضافة موزع -->
            <div id="driverTab" class="tab-content">
                <h3 style="margin-bottom: 16px;">إضافة موزع جديد</h3>
                <form id="driverForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم الموزع</label>
                            <input type="text" id="driverName" placeholder="اسم الموزع" required>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="tel" id="driverPhone" placeholder="07XXXXXXXX" required>
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="driverPassword" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">حفظ الموزع</button>
                </form>
            </div>

            <!-- محتوى تبويب السجل -->
            <div id="historyTab" class="tab-content">
                <h3 style="margin-bottom: 16px;">سجل آخر الحركات</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>التاريخ والوقت</th>
                                <th>النوع</th>
                                <th>اسم الزبون</th>
                                <th>رقم الهاتف</th>
                                <th>الكمية</th>
                                <th>المنفذ</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTable">
                            <tr><td colspan="6" style="text-align: center;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentStation = JSON.parse(localStorage.getItem('station_user')) || null;

        document.addEventListener('DOMContentLoaded', () => {
            if (currentStation) {
                showDashboard();
            }
        });

        // تسجيل دخول المحطة
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/station/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                const data = await res.json();
                if (data.success) {
                    currentStation = data.station;
                    localStorage.setItem('station_user', JSON.stringify(currentStation));
                    showDashboard();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('خطأ في الاتصال بالخادم');
            }
        });

        function showDashboard() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            document.getElementById('stationNameDisplay').innerText = currentStation.name;
            loadStats();
            loadTransactions();
        }

        function logout() {
            localStorage.removeItem('station_user');
            location.reload();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // جلب الإحصائيات
        async function loadStats() {
            if (!currentStation) return;
            const res = await fetch(`/api/station/${currentStation.id}/stats`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('statRecharged').innerText = data.stats.totalRecharged;
                document.getElementById('statDeducted').innerText = data.stats.totalDeducted;
                document.getElementById('statBalance').innerText = data.stats.totalBalance;
            }
        }

        // جلب سجل الحركات
        async function loadTransactions() {
            if (!currentStation) return;
            const res = await fetch(`/api/station/${currentStation.id}/transactions`);
            const data = await res.json();
            if (data.success) {
                const tbody = document.getElementById('transactionsTable');
                tbody.innerHTML = '';
                data.transactions.forEach(t => {
                    const badgeClass = t.action_type === 'شحن' ? 'badge-recharge' : 'badge-deduct';
                    const date = new Date(t.created_at).toLocaleString('ar-JO');
                    tbody.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td><span class="badge ${badgeClass}">${t.action_type}</span></td>
                            <td>${t.customer_name}</td>
                            <td>${t.customer_phone}</td>
                            <td><b>${t.amount}</b></td>
                            <td>${t.driver_name}</td>
                        </tr>
                    `;
                });
            }
        }

        // شحن رصيد زبون
        document.getElementById('rechargeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                stationId: currentStation.id,
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                coupons: document.getElementById('custCoupons').value
            };

            const res = await fetch('/api/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            alert(data.message);
            if (data.success) {
                document.getElementById('rechargeForm').reset();
                loadStats();
                loadTransactions();
            }
        });

        // إضافة موزع
        document.getElementById('driverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                stationId: currentStation.id,
                name: document.getElementById('driverName').value,
                phone: document.getElementById('driverPhone').value,
                password: document.getElementById('driverPassword').value
            };

            const res = await fetch('/api/drivers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            alert(data.message);
            if (data.success) {
                document.getElementById('driverForm').reset();
            }
        });
    </script>
</body>
</html>
